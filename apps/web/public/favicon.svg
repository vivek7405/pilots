<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pilots">
  <!-- The Pilots favicon: the Delta mark in light ink on a deep-ink tile.

       A tile and not the bare mark, because a tab bar is light in one browser
       and dark in the next, and a bare dark mark disappears on the dark one.
       The PNG and ICO fallbacks cannot follow a colour scheme either, so the
       icon carries its own ground everywhere. The hairline border is what
       separates the tile from a dark tab bar.

       The drawing is the one in site/lib/design/logo-candidates.ts, and
       test/site/favicon.test.ts fails if the two paths stop matching. It is
       scaled to 0.88 about its own centre, which keeps the band at close to a
       whole pixel in a 16 pixel tab. Any smaller and the cut closes up, and a
       leaning triangle without its cut reads as a play button.

       scripts/generate-favicon.sh bakes every raster from this file. Change
       the icon here and run it, never edit a PNG. -->
  <rect id="tile" x="0.5" y="0.5" width="31" height="31" rx="7" fill="#0e1014" stroke="#333a45" stroke-width="1"/>
  <g transform="translate(16 16) scale(0.88) translate(-16.03 -15.7)">
    <g transform="translate(5.4 0)">
      <g transform="skewX(-11)">
        <path d="M16 3.8 L26.8 27.6 L16 21.4 L5.2 27.6 Z" fill="#e9e7e1"/>
      </g>
    </g>
    <rect x="3" y="17.6" width="26" height="2" fill="#0e1014"/>
  </g>
</svg>
