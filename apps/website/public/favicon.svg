<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pilots">
  <!-- The mark is an attitude indicator: the instrument that tells a pilot
       which way is up. A horizon line across a dark square, with the signal
       green as ground. It reads at 16px because it is two shapes, and it is
       not a letter, a hexagon, or an abstract swoosh. -->
  <rect width="32" height="32" rx="6" fill="#0e1014"/>
  <path d="M4 20h24v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="#b9f227"/>
  <path d="M4 20h24" stroke="#b9f227" stroke-width="2"/>
  <path d="M10 16.5h4M18 16.5h4M16 13.5v3" stroke="#e9e7e1" stroke-width="1.8" stroke-linecap="round"/>
</svg>
