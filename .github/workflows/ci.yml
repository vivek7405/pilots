name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: go (hostd)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/hostd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...
      # The guest-agent is baked into the rootfs, where there is no libc we
      # control -- it must link statically.
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/guest-agent

  go-sdk:
    name: go (sdk)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sdks/go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The drift test parses apps/hostd/internal/api, so it is this job that
      # catches a wire change landing without the mirror.
      - run: go test ./...

  go-cli:
    name: go (cli)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/pilot/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...

  python-sdk:
    name: python (sdk)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The drift test parses apps/hostd/internal/api, so it is this job that
      # catches a wire change landing without the Python mirror. The adk extra
      # is installed so the seven ADK tool objects are really built rather
      # than skipped.
      - run: uv run --extra dev --extra adk pytest -q
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev mypy src

  ts:
    name: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check scripts/e2e.mjs
      - run: npm run test:sdk-js
      # Proves dist/ still builds; the published package is what dist/ holds.
      - run: npm run build:sdk-js
      # The CLI's own gate: `tsc --noEmit` (which is the only static check a
      # package with no emit and no linter has) plus its unit tests. It runs
      # AFTER build:sdk-js because @pilots/sdk publishes out of dist/, and a
      # fresh checkout has nothing for the type check to resolve until then.
      - run: npm test --workspace=packages/cli
      # Skips cleanly without PILOTS_E2E=1; this asserts the skip path works.
      - run: npm run test:e2e

  elixir-sdk:
    name: elixir (sdk)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - run: mix deps.get
      # The drift test parses apps/hostd/internal/api/routes.go, so it is this
      # job that catches a renamed route landing without the client.
      - run: mix test
      - run: mix format --check-formatted

  nvim:
    name: nvim plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The suite runs in Neovim itself rather than under busted, because
      # busted is a luarocks install and a suite that needs one more system
      # dependency than the plugin does is a suite that eventually gets
      # skipped. Neovim is already required to USE the plugin.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim -l apps/nvim/test/run.lua
      # The end-to-end half drives real autocommands and a real buffer through
      # a stand-in CLI, so it needs no fleet and no KVM. It is what proves the
      # chunking actually reassembles and that an empty file stays empty.
      - run: nvim -l apps/nvim/test/e2e.lua

  vscode:
    name: vscode extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      # The extension imports @pilots/sdk, which publishes out of dist/, so
      # the SDK builds first exactly as the CLI job needs it to.
      - run: npm run build:sdk-js
      - run: npm test --workspace=apps/vscode
      - run: npm run typecheck --workspace=apps/vscode

  website:
    name: website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Installed from the REPO ROOT: apps/website is an npm workspace member,
      # so its dependencies resolve through the root lockfile. Installing
      # inside the app directory would write a second lockfile and defeat the
      # point of it being a workspace at all.
      - run: npm install
        working-directory: .
      # The browser suite drives the two demos in real Chromium. Without this
      # the tests fail on a missing browser rather than on a real defect.
      - run: npx playwright install --with-deps chromium
      # The FULL suite here, server plus browser. The repo root's `npm test`
      # deliberately runs only the server half: it must stay green on any
      # machine with a checkout and nothing else, and a chromium download is
      # exactly the kind of setup that rule exists to keep out of it. CI is
      # where the browser half belongs.
      - run: npm test

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # From the REPO ROOT: apps/dashboard is a workspace member and imports
      # @pilots/sdk from another one, so both resolve through the root lockfile.
      - run: npm install
      # @pilots/sdk resolves through its package `exports` to dist/, which is
      # gitignored. Without this the dashboard's typecheck has no types to read.
      - run: npm run build:sdk-js
      - run: npm run test:dashboard
      # The browser half needs a real Chromium, which is exactly the setup the
      # repo root's `npm test` keeps out of itself. CI is where it belongs. The
      # one browser test is required rather than optional: applying a live delta
      # to the machine list is post-hydration behaviour, so the served bytes are
      # identical whether it works or not.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard:browser

  boot:
    name: firecracker boot gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum

      # Probe rather than assume. If a runner image stops exposing KVM, the job
      # skips loudly instead of turning the whole pipeline red -- the laptop
      # gate still covers the boot.
      - id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          if [ -w /dev/kvm ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::/dev/kvm unavailable; skipping the boot gate"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.kvm.outputs.ok == 'true'
        run: sudo PREFIX=/opt/pilots scripts/fetch-firecracker.sh
      - if: steps.kvm.outputs.ok == 'true'
        run: sudo PREFIX=/opt/pilots scripts/fetch-kernel.sh
      - if: steps.kvm.outputs.ok == 'true'
        run: scripts/build-golden-rootfs.sh
      - if: steps.kvm.outputs.ok == 'true'
        run: scripts/dev-vm.sh

      - if: always() && steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firecracker-serial-log
          path: /tmp/pilots-dev-vm-*.log
          if-no-files-found: ignore

  # Determinism, asserted by building the real image twice and diffing.
  #
  # This used to SKIP itself on a runner whose mke2fs could not deliver, which
  # was every runner: Ubuntu 24.04 ships e2fsprogs 1.47.0, which ignores
  # SOURCE_DATE_EPOCH and stamps the clock into the superblock and inodes.
  # A check that skips itself on the only machine that always runs it is a
  # check nobody is running.
  #
  # The pack now happens inside a PINNED container with a known e2fsprogs, so
  # the runner's own toolchain no longer decides anything -- and the pin in
  # *.sha256 means the same bytes on a laptop, on a runner and on a host,
  # which no combination of flags on the host could buy. So this job fails
  # rather than skips.
  #
  # Path-filtered: only these inputs can change the image, and it is two
  # four-minute builds when it does run.
  rootfs-deterministic:
    name: golden rootfs builds the same bytes twice
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: touched
        run: |
          # A branch's first build has no HEAD~1 to diff against, so fall back
          # to running the check rather than skipping on a diff that could not
          # be computed.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -qE \
              '^(scripts/rootfs/|scripts/build-golden-rootfs\.sh|apps/hostd/cmd/guest-agent/)'; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "ok=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # The pack now runs inside a pinned container, so the RUNNER's own
      # e2fsprogs no longer decides whether this check can mean anything. What
      # it needs is Docker, which every GitHub runner has, and that is why this
      # step fails rather than skipping: a check that skips itself on the one
      # machine that always runs it is a check nobody is running.
      - id: capable
        if: steps.touched.outputs.ok == 'true'
        name: the pinned pack toolchain is reachable
        run: |
          docker info >/dev/null
          echo "packing inside the pinned image, so two builds must match"
      - if: steps.touched.outputs.ok == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum
      - if: steps.touched.outputs.ok == 'true'
        name: build it twice and compare
        run: |
          scripts/build-golden-rootfs.sh
          first=$(sha256sum < scripts/rootfs/golden.ext4)
          rm -f scripts/rootfs/golden.ext4
          scripts/build-golden-rootfs.sh
          second=$(sha256sum < scripts/rootfs/golden.ext4)
          if [ "$first" != "$second" ]; then
            echo "::error::Two builds of the same tree produced different images."
            echo "::error::  first  ${first%% *}"
            echo "::error::  second ${second%% *}"
            echo "::error::Something nondeterministic got back into"
            echo "::error::scripts/build-golden-rootfs.sh -- a random uuid, a hash"
            echo "::error::seed, or a timestamp that is not clamped. The pack"
            echo "::error::toolchain itself is pinned, so it is not the packer."
            exit 1
          fi
          echo "both builds: ${first%% *}"

  # The golden rootfs, built at a tag and pinned.
  #
  # It is built HERE and not on a fleet host because the route is
  # docker export -> fakeroot -> mke2fs, and a pilots host installs rootless
  # BuildKit rather than docker. The other half of a template -- the memory
  # image -- is deliberately NOT built here and never can be: it carries raw
  # CPUID, so it exists only as builds a fleet host chunkified from its own
  # boot. That split is the enforcement, not a convention.
  template:
    name: golden rootfs (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: go
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum

      # The pin is read BEFORE the build, because build-golden-rootfs.sh
      # rewrites scripts/rootfs/golden.ext4.sha256 as its last step -- checking
      # that file afterwards would compare the image with itself and pass on
      # every input. The authority is the hash committed at the tag.
      - run: git show "${GITHUB_SHA}:scripts/rootfs/golden.ext4.sha256" > /tmp/pinned.sha256
      - run: git show "${GITHUB_SHA}:scripts/rootfs/builder.ext4.sha256" > /tmp/pinned-builder.sha256
      - run: scripts/build-golden-rootfs.sh
      - name: the rootfs CI built is the one pinned at this tag
        run: |
          sha256sum -c /tmp/pinned.sha256 || {
            echo "::error::The rootfs built at this tag does not match"
            echo "::error::scripts/rootfs/golden.ext4.sha256. The pin was not"
            echo "::error::refreshed with the change that altered the image, so"
            echo "::error::the tag is wrong -- not the build."
            exit 1
          }

      # The builder image is the same pipeline with a different Dockerfile: the
      # golden guest plus a BuildKit daemon, which is what a per-org builder
      # machine runs so that a customer's Dockerfile never executes on a host.
      - run: VARIANT=builder scripts/build-golden-rootfs.sh
      - name: the builder rootfs CI built is the one pinned at this tag
        run: |
          sha256sum -c /tmp/pinned-builder.sha256 || {
            echo "::error::The builder rootfs built at this tag does not match"
            echo "::error::scripts/rootfs/builder.ext4.sha256. Refresh the pin"
            echo "::error::with the change that altered the image."
            exit 1
          }

      - run: zstd -T0 -19 scripts/rootfs/golden.ext4 -o "golden-${GITHUB_REF_NAME}.ext4.zst"
      - run: zstd -T0 -19 scripts/rootfs/builder.ext4 -o "builder-${GITHUB_REF_NAME}.ext4.zst"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing in this repo creates the release, and a plain `git push
          # --tags` is what triggers this job -- so upload alone fails with
          # "release not found" on every tag that has no release yet.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "golden-${GITHUB_REF_NAME}.ext4.zst" \
            "builder-${GITHUB_REF_NAME}.ext4.zst" \
            scripts/rootfs/golden.ext4.sha256 \
            scripts/rootfs/builder.ext4.sha256 --clobber
