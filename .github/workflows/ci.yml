name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: go (hostd)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/hostd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...
      # The guest-agent is baked into the rootfs, where there is no libc we
      # control -- it must link statically.
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/guest-agent

  go-sdk:
    name: go (sdk)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sdks/go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The drift test parses apps/hostd/internal/api, so it is this job that
      # catches a wire change landing without the mirror.
      - run: go test ./...

  ts:
    name: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --check scripts/e2e.mjs
      - run: npm run test:sdk-js
      # Proves dist/ still builds; the published package is what dist/ holds.
      - run: npm run build:sdk-js
      # The CLI's own gate: `tsc --noEmit` (which is the only static check a
      # package with no emit and no linter has) plus its unit tests. It runs
      # AFTER build:sdk-js because @pilots/sdk publishes out of dist/, and a
      # fresh checkout has nothing for the type check to resolve until then.
      - run: npm test --workspace=packages/cli
      # Skips cleanly without PILOTS_E2E=1; this asserts the skip path works.
      - run: npm run test:e2e

  website:
    name: website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Installed from the REPO ROOT: apps/website is an npm workspace member,
      # so its dependencies resolve through the root lockfile. Installing
      # inside the app directory would write a second lockfile and defeat the
      # point of it being a workspace at all.
      - run: npm install
        working-directory: .
      # The browser suite drives the two demos in real Chromium. Without this
      # the tests fail on a missing browser rather than on a real defect.
      - run: npx playwright install --with-deps chromium
      # The FULL suite here, server plus browser. The repo root's `npm test`
      # deliberately runs only the server half: it must stay green on any
      # machine with a checkout and nothing else, and a chromium download is
      # exactly the kind of setup that rule exists to keep out of it. CI is
      # where the browser half belongs.
      - run: npm test

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # From the REPO ROOT: apps/dashboard is a workspace member and imports
      # @pilots/sdk from another one, so both resolve through the root lockfile.
      - run: npm install
      # @pilots/sdk resolves through its package `exports` to dist/, which is
      # gitignored. Without this the dashboard's typecheck has no types to read.
      - run: npm run build:sdk-js
      - run: npm run test:dashboard
      # The browser half needs a real Chromium, which is exactly the setup the
      # repo root's `npm test` keeps out of itself. CI is where it belongs. The
      # one browser test is required rather than optional: applying a live delta
      # to the machine list is post-hydration behaviour, so the served bytes are
      # identical whether it works or not.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard:browser

  boot:
    name: firecracker boot gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum

      # Probe rather than assume. If a runner image stops exposing KVM, the job
      # skips loudly instead of turning the whole pipeline red -- the laptop
      # gate still covers the boot.
      - id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          if [ -w /dev/kvm ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::/dev/kvm unavailable; skipping the boot gate"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.kvm.outputs.ok == 'true'
        run: sudo PREFIX=/opt/pilots scripts/fetch-firecracker.sh
      - if: steps.kvm.outputs.ok == 'true'
        run: sudo PREFIX=/opt/pilots scripts/fetch-kernel.sh
      - if: steps.kvm.outputs.ok == 'true'
        run: scripts/build-golden-rootfs.sh
      - if: steps.kvm.outputs.ok == 'true'
        run: scripts/dev-vm.sh

      - if: always() && steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firecracker-serial-log
          path: /tmp/pilots-dev-vm-*.log
          if-no-files-found: ignore

  # The golden rootfs, built at a tag and pinned.
  #
  # It is built HERE and not on a fleet host because the route is
  # docker export -> fakeroot -> mke2fs, and a pilots host installs rootless
  # BuildKit rather than docker. The other half of a template -- the memory
  # image -- is deliberately NOT built here and never can be: it carries raw
  # CPUID, so it exists only as builds a fleet host chunkified from its own
  # boot. That split is the enforcement, not a convention.
  template:
    name: golden rootfs (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: go
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: apps/hostd/go.sum

      # The pin is read BEFORE the build, because build-golden-rootfs.sh
      # rewrites scripts/rootfs/golden.ext4.sha256 as its last step -- checking
      # that file afterwards would compare the image with itself and pass on
      # every input. The authority is the hash committed at the tag.
      - run: git show "${GITHUB_SHA}:scripts/rootfs/golden.ext4.sha256" > /tmp/pinned.sha256
      - run: scripts/build-golden-rootfs.sh
      - name: the rootfs CI built is the one pinned at this tag
        run: |
          sha256sum -c /tmp/pinned.sha256 || {
            echo "::error::The rootfs built at this tag does not match"
            echo "::error::scripts/rootfs/golden.ext4.sha256. The pin was not"
            echo "::error::refreshed with the change that altered the image, so"
            echo "::error::the tag is wrong -- not the build."
            exit 1
          }

      - run: zstd -T0 -19 scripts/rootfs/golden.ext4 -o "golden-${GITHUB_REF_NAME}.ext4.zst"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing in this repo creates the release, and a plain `git push
          # --tags` is what triggers this job -- so upload alone fails with
          # "release not found" on every tag that has no release yet.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "golden-${GITHUB_REF_NAME}.ext4.zst" \
            scripts/rootfs/golden.ext4.sha256 --clobber
